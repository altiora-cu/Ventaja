# Scripts de instalación permitidos (pnpm 10 los bloquea por defecto).
onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@swc/core'
  - esbuild
  - unrs-resolver
  - sharp

# pnpm 11+ usa allowBuilds en lugar de onlyBuiltDependencies.
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  unrs-resolver: true
